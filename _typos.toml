# The protocol spec is vendor text converted verbatim from the Nanonis
# PDF; its typos are the document's, not ours.
[files]
extend-exclude = ["docs/tcp-protocol.md"]

[default.extend-words]
# Attocube ANC150 positioner, not a typo of "and".
ANC = "ANC"

[default]
# Spec command names ZSpectr.Retract2ndSet/Get; "2nd" is not a typo of "and".
extend-ignore-re = ["Retract2nd"]
