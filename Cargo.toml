[package]
name = "nanonis-rs"
version = "0.4.0"
edition = "2024"
description = "Rust client library for Nanonis SPM system control via TCP"
repository = "https://github.com/kronberger-droid/nanonis-rs"
license = "MIT"
authors = ["Martin Kronberger <kronberger@proton.me>"]
keywords = ["nanonis", "spm", "stm", "afm", "microscopy"]
categories = ["science", "api-bindings"]
readme = "README.md"
homepage = "https://github.com/kronberger-droid/nanonis-rs"
documentation = "https://docs.rs/nanonis-rs"
# Keep the published crate lean: ship only source + docs, not dev/CI files
# or the 3.6 MB protocol manual.
exclude = [
    "docs/",
    "CLAUDE.md",
    ".github/",
    "flake.nix",
    "flake.lock",
    "rustfmt.toml",
    ".gitignore",
]

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# A panic in a client crate driving hardware takes the caller's tip with
# it, so library code must be panic-free. Tests are exempt via clippy.toml.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
# -- Wanted, but need larger changes first (hit counts from 2026-08-12) --
# indexing_slicing = "deny"        # ~1300 hits: protocol parsing indexes wire buffers
# arithmetic_side_effects = "deny" # ~30 hits: wire-size arithmetic, sweep helpers
# as_conversions = "deny"          # ~300 hits: f32/f64 wire conversions are the crate's
#                                  # bread and butter; consider the finer cast_* lints
# pedantic = { level = "warn", priority = -1 }  # triage before enabling: CI denies warnings
