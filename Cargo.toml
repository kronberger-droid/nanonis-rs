[package]
name = "nanonis-rs"
version = "0.4.0"
edition = "2024"
description = "Rust client library for Nanonis SPM system control via TCP"
repository = "https://github.com/kronberger-droid/nanonis-rs"
license = "MIT"
authors = ["Martin Kronberger <kronberger@proton.me>"]
keywords = ["nanonis", "spm", "stm", "afm", "microscopy"]
categories = ["science", "api-bindings"]
readme = "README.md"
homepage = "https://github.com/kronberger-droid/nanonis-rs"
documentation = "https://docs.rs/nanonis-rs"
# Keep the published crate lean: ship only source + docs, not dev/CI files
# or the 3.6 MB protocol manual.
exclude = [
    "TCPProtocol_SPM.pdf",
    "CLAUDE.md",
    ".github/",
    "flake.nix",
    "flake.lock",
    "rustfmt.toml",
    ".gitignore",
]

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
